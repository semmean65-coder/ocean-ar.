<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة المستكشف الصغير: أسرار المحيط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2457C5;--yellow:#FFD23F;--ink:#1B2A4A;--paper:#FBFCFF;--grid:rgba(36,87,197,.10);--sea:#1fa3e0;--deep:#0b5c9e;--coral:#ff6f61;--green:#1f9d6b;--shadow:rgba(10,40,80,.3);
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#FBFCFF;--ink:#1B2A4A;color-scheme:light}}
:root[data-theme="dark"]{--paper:#FBFCFF;--ink:#1B2A4A}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;background:#0b5c9e;color:var(--ink);font-family:'Tajawal',Tahoma,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.hidden{display:none !important}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#000}
#bg{position:fixed;inset:0;z-index:0;background:linear-gradient(#bfeaff 0%,#8fd3f5 45%,#3aa2dc 60%,#0f6aa8 100%)}
#tint{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 120%,rgba(20,140,210,.0),rgba(20,140,210,.0));transition:background 1.2s}
#tint.on{background:radial-gradient(ellipse at 50% 110%,rgba(15,120,200,.38),rgba(15,120,200,.08) 70%)}
#gl{position:fixed;inset:0;z-index:1;touch-action:none}
#gl canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;z-index:5;pointer-events:none}
#ui .p{pointer-events:auto}
.paper{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:3px solid var(--ink);border-radius:24px 10px 22px 12px / 12px 22px 10px 24px;box-shadow:4px 6px 0 var(--shadow);color:var(--ink)}
h1,h2,.lz{font-family:'Lalezar','Tajawal',sans-serif;font-weight:400;letter-spacing:0}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:62px;padding:10px 24px;font-family:'Tajawal',sans-serif;font-weight:800;font-size:21px;color:#fff;background:var(--blue);border:3px solid var(--ink);border-radius:20px 9px 18px 11px;box-shadow:4px 6px 0 var(--yellow);text-align:center;line-height:1.2;transition:transform .12s}
.btn:active{transform:translate(2px,3px) scale(.98);box-shadow:1px 1px 0 var(--yellow)}
.btn:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
.btn.alt{background:var(--yellow);color:var(--ink);box-shadow:4px 6px 0 var(--blue)}
.btn.sea{background:linear-gradient(#2fb6ef,#1683c9);}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:3px 5px 0 var(--shadow)}
.btn.sm{min-height:50px;font-size:18px;padding:6px 16px}
/* start screen */
#start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden;background:linear-gradient(#aee7ff,#47b4ea 55%,#0f6aa8)}
#start .waves{position:absolute;left:-10%;right:-10%;bottom:-6px;height:28vh;background:radial-gradient(circle at 50% -40%,transparent 60%,rgba(255,255,255,.35) 61%,transparent 64%) 0 0/120px 60px repeat-x,linear-gradient(transparent,rgba(5,60,110,.5));animation:wave 6s linear infinite}
@keyframes wave{to{background-position:120px 0,0 0}}
#start .bub{position:absolute;bottom:-40px;width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.8);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh)}}
#start .card{position:relative;width:min(540px,95vw);padding:22px 22px 18px;text-align:center}
#start h1{font-size:clamp(34px,8vw,52px);color:var(--blue);margin:0;line-height:1.15}
#start .sub{font-family:'Lalezar',sans-serif;font-size:28px;color:#0f7fb0;margin:2px 0 6px}
#start .hero{font-size:78px;line-height:1.1;display:inline-block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-5deg)}}
#start p{font-size:19px;font-weight:700;line-height:1.7;margin:8px 0 14px}
#start .acts{display:flex;flex-direction:column;gap:12px;align-items:stretch}
#start .note{font-size:14px;font-weight:700;opacity:.8;margin-top:10px;line-height:1.6}
/* hud */
#top{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;left:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#prog{display:flex;gap:6px;padding:6px 8px;align-items:center}
.shell{width:58px;height:62px;border-radius:16px;border:3px dashed #1B2A4A;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;opacity:.4;background:#fff;line-height:1}
.shell small{font-size:11px;font-weight:800;margin-top:3px}
.shell.on{opacity:1;border-style:solid;background:#fff3c4;animation:popin .6s}
@keyframes popin{40%{transform:scale(1.3) rotate(-8deg)}}
#topBtns{display:flex;gap:6px}
.ib{all:unset;cursor:pointer;width:54px;height:54px;border-radius:16px;border:3px solid #1B2A4A;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:3px 4px 0 var(--shadow)}
#guide{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(620px,96vw);padding:10px 14px;display:flex;gap:12px;align-items:center}
#guide .av{font-size:56px;line-height:1;flex:0 0 auto;animation:bob 2.4s ease-in-out infinite}
#gText{font-size:22px;font-weight:800;line-height:1.5;flex:1}
#gActs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.turn{position:absolute;top:44%;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.6);animation:nudge 1s ease-in-out infinite}
.turn .ar{width:74px;height:74px;border-radius:50%;background:var(--yellow);border:4px solid #1B2A4A;display:flex;align-items:center;justify-content:center;font-size:40px;color:#1B2A4A;text-shadow:none;box-shadow:3px 5px 0 rgba(0,0,0,.25)}
#turnL{left:12px;--nx:-10px}#turnR{right:12px;--nx:10px}
@keyframes nudge{50%{transform:translateX(var(--nx))}}
#quiz{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(5,40,80,.35)}
#quiz .box{width:min(580px,96vw);padding:16px;text-align:center;animation:popin .4s}
#qText{font-family:'Lalezar',sans-serif;font-size:clamp(26px,6vw,34px);color:var(--blue);line-height:1.3;margin-bottom:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pic{all:unset;box-sizing:border-box;cursor:pointer;border:4px solid #1B2A4A;border-radius:24px 10px 22px 12px;background:linear-gradient(#ffffff,#eaf7ff);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:4px 6px 0 var(--shadow);min-height:180px;justify-content:center}
.pic .em{font-size:92px;line-height:1.1}
.pic .lb{font-size:21px;font-weight:800;line-height:1.3}
.pic.good{background:#c9f0dd;border-color:#1f9d6b;animation:popin .5s}
.pic.bad{background:#ffe1e1;border-color:#E5484D;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pic:focus-visible{outline:4px solid var(--yellow)}
#end{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(5,40,80,.4)}
#end .box{width:min(540px,95vw);padding:18px;text-align:center;animation:popin .5s}
#end .big{font-size:96px;line-height:1}
#end h2{font-size:36px;color:var(--blue);margin:4px 0}
.sum{display:flex;justify-content:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.sum div{border:3px solid #1B2A4A;border-radius:16px;background:#fff3c4;padding:8px 10px;font-weight:800;font-size:17px;min-width:100px}
.sum span{display:block;font-size:42px}
.conf{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#toast{position:absolute;top:calc(92px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:8px 18px;font-weight:800;font-size:18px;white-space:nowrap;opacity:0;transition:opacity .4s}
#xrHint{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-size:21px;font-weight:800;padding:12px 18px;text-align:center;width:min(440px,90vw);line-height:1.6}
@media (max-height:560px){.pic{min-height:120px}.pic .em{font-size:60px}#guide .av{font-size:40px}#gText{font-size:18px}.shell{width:48px;height:52px}}
@media (prefers-reduced-motion: reduce){#guide .av,#start .hero,.shell.on,.pic.good,.pic.bad,.turn,#start .waves,#start .bub,.conf{animation:none}}
</style>
</head>
<body>
<video id="cam" class="hidden" playsinline muted autoplay></video>
<div id="bg"></div>
<div id="gl"></div>
<div id="tint"></div>

<div id="start">
  <div class="waves"></div>
  <div class="card paper">
    <div class="hero">🐢</div>
    <h1>رحلة المستكشف الصغير</h1>
    <div class="sub">أسرار المحيط 🌊</div>
    <p>أنا لؤلؤة السلحفاة! سيصير المحيط حولك في غرفتك. التفت في كل مكان، واكتشف أسراره معي.</p>
    <div class="acts">
      <button class="btn sea" id="btnAR">📷 ابدأ بالواقع المعزز</button>
      <button class="btn ghost" id="btnNoAR">ابدأ بدون كاميرا</button>
    </div>
    <div class="note" id="startNote">قف في مكان واسع، وارفع الصوت 🔊</div>
  </div>
</div>

<div id="ui" class="hidden">
  <div id="top">
    <div id="prog" class="paper p"><div class="shell" id="sh1">🏠<small>موطن</small></div><div class="shell" id="sh2">🐟<small>غذاء</small></div><div class="shell" id="sh3">🚢<small>طريق</small></div></div>
    <div id="topBtns" class="p"><button class="ib" id="btnMute" aria-label="الصوت">🔊</button><button class="ib" id="btnRe" aria-label="اجعل المحيط حولي">🎯</button><button class="ib" id="btnSay" aria-label="أعد الكلام">🔁</button></div>
  </div>
  <div id="xrHint" class="paper hidden"></div>
  <div class="turn hidden" id="turnL"><div class="ar">→</div>التفت</div>
  <div class="turn hidden" id="turnR"><div class="ar">←</div>التفت</div>
  <div id="guide" class="paper p"><div class="av">🐢</div><div style="flex:1"><div id="gText"></div><div id="gActs"></div></div></div>
  <div id="quiz" class="p hidden"><div class="box paper"><div id="qText"></div><div class="opts"><button class="pic" id="optA"><span class="em"></span><span class="lb"></span></button><button class="pic" id="optB"><span class="em"></span><span class="lb"></span></button></div></div></div>
  <div id="end" class="p hidden"><div class="box paper">
    <div class="big">🏅</div><h2>أنت صديق المحيط!</h2>
    <div class="sum"><div><span>🏠</span>موطن للكائنات</div><div><span>🐟</span>مصدر للغذاء</div><div><span>🚢</span>طريق للسفن</div></div>
    <div style="font-size:20px;font-weight:800;line-height:1.6">ونحميه برمي النفايات في السلة 🗑️</div>
    <div style="margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" id="btnAgain">العب مرة أخرى</button><button class="btn ghost" id="btnEndClose">ابقَ في المحيط</button></div>
  </div></div>
  <div id="toast" class="paper"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
if(!window.THREE){$('#startNote').textContent='تعذّر تحميل المحرك. تأكد من الإنترنت ثم أعد تحميل الصفحة.';return;}
const V3=THREE.Vector3;const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,D=Math.PI/180;
function wrapA(a){return((a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;}
let seed=11;function rnd(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646;}

/* ---------- start screen bubbles ---------- */
for(let i=0;i<14;i++){const b=document.createElement('div');b.className='bub';b.style.left=(Math.random()*100)+'%';b.style.animationDuration=(6+Math.random()*7)+'s';b.style.animationDelay=(-Math.random()*8)+'s';const s=12+Math.random()*22;b.style.width=b.style.height=s+'px';$('#start').appendChild(b);}

/* ---------- voice + sounds ---------- */
let muted=false,arVoice=null,lastLine='';
function pickVoice(){const vs=window.speechSynthesis?speechSynthesis.getVoices():[];arVoice=vs.find(v=>/^ar/i.test(v.lang))||null;}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(text){lastLine=text;$('#gText').textContent=text;if(muted||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=arVoice?arVoice.lang:'ar-SA';if(arVoice)u.voice=arVoice;u.rate=.9;u.pitch=1.15;speechSynthesis.speak(u);}catch(e){}}
let AC=null,oceanG=null;function audio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();
  const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const src=AC.createBufferSource();src.buffer=buf;src.loop=true;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;oceanG=AC.createGain();oceanG.gain.value=0;src.connect(lp);lp.connect(oceanG);oceanG.connect(AC.destination);src.start();}catch(e){}}
function tone(f,d,type,g,f2,delay){if(!AC||muted)return;const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),gn=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(g||.08,t0+.02);gn.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(gn);gn.connect(AC.destination);o.start(t0);o.stop(t0+d+.05);}
const chime=()=>[660,880,1175,1568].forEach((f,i)=>tone(f,.45,'triangle',.08,null,i*.08));
const pop=()=>tone(500,.18,'sine',.09,1100);
const splash=()=>{tone(260,.7,'sine',.07,80);for(let i=0;i<8;i++)tone(600+Math.random()*1200,.08,'sine',.03,1600,i*.05);};
const nope=()=>tone(240,.35,'triangle',.07,170);
$('#btnMute').addEventListener('click',()=>{muted=!muted;$('#btnMute').textContent=muted?'🔇':'🔊';if(muted&&window.speechSynthesis)speechSynthesis.cancel();if(oceanG)oceanG.gain.value=0;});
$('#btnSay').addEventListener('click',()=>say(lastLine));
let toastT;function toast(s){const el=$('#toast');el.textContent=s;el.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity=0,2200);}

/* ---------- renderer ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.setClearColor(0x000000,0);$('#gl').appendChild(renderer.domElement);
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.02,80);camera.rotation.order='YXZ';scene.add(camera);
scene.add(new THREE.HemisphereLight('#ffffff','#6a86a6',1.05));const sun=new THREE.DirectionalLight('#ffffff',.85);sun.position.set(2,6,3);scene.add(sun);
addEventListener('resize',()=>{if(renderer.xr.isPresenting)return;renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

/* ---------- toon look with ink outlines ---------- */
const grad=(()=>{const d=new Uint8Array([95,95,95,255,180,180,180,255,255,255,255,255]);const t=new THREE.DataTexture(d,3,1,THREE.RGBAFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t;})();
const T=c=>{const m=new THREE.MeshToonMaterial({color:c,gradientMap:grad});m.color.convertSRGBToLinear();return m;};
const inkMat=(()=>{const m=new THREE.MeshBasicMaterial({color:'#1B2A4A',side:THREE.BackSide});m.onBeforeCompile=s=>{s.vertexShader=s.vertexShader.replace('#include <begin_vertex>','vec3 transformed=position+normal*0.035;');};return m;})();
function part(geo,col,x,y,z,parent,ink){const m=new THREE.Mesh(geo,typeof col==='string'?T(col):col);m.position.set(x||0,y||0,z||0);parent.add(m);if(ink!==false)m.add(new THREE.Mesh(geo,inkMat));return m;}
function cTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;}
const radial=cTex(256,256,(x,w,h)=>{const g=x.createRadialGradient(128,128,0,128,128,128);g.addColorStop(0,'#fff');g.addColorStop(.72,'#fff');g.addColorStop(1,'#000');x.fillStyle=g;x.fillRect(0,0,w,h);});radial.encoding=THREE.LinearEncoding;
const soft=cTex(64,64,x=>{const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.5,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);});
const ring=cTex(64,64,x=>{x.strokeStyle='rgba(255,255,255,.95)';x.lineWidth=5;x.beginPath();x.arc(32,32,24,0,Math.PI*2);x.stroke();x.fillStyle='rgba(220,250,255,.25)';x.fill();x.fillStyle='rgba(255,255,255,.95)';x.beginPath();x.arc(24,24,5,0,Math.PI*2);x.fill();});
function label(text,w){const tex=cTex(512,128,(x,W,H)=>{x.fillStyle='#fff';x.strokeStyle='#1B2A4A';x.lineWidth=10;const r=40;x.beginPath();x.moveTo(r,6);x.lineTo(W-r,6);x.quadraticCurveTo(W-6,6,W-6,r);x.lineTo(W-6,H-r);x.quadraticCurveTo(W-6,H-6,W-r,H-6);x.lineTo(r,H-6);x.quadraticCurveTo(6,H-6,6,H-r);x.lineTo(6,r);x.quadraticCurveTo(6,6,r,6);x.fill();x.stroke();
  x.fillStyle='#2457C5';x.font="64px Lalezar, Tajawal, sans-serif";x.direction='rtl';x.textAlign='center';x.textBaseline='middle';x.fillText(text,W/2,H/2+6);});
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));s.renderOrder=40;const sw=w||.5;s.scale.set(sw,sw/4,1);s.visible=false;return s;}
const tapTex=cTex(128,128,x=>{x.fillStyle='rgba(255,210,63,.96)';x.strokeStyle='#1B2A4A';x.lineWidth=8;x.beginPath();x.arc(64,64,50,0,Math.PI*2);x.fill();x.stroke();x.font='60px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('👆',64,70);});
function tapMark(sz){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tapTex,depthTest:false,transparent:true}));s.renderOrder=41;s.userData.sz=sz||.16;s.scale.set(s.userData.sz,s.userData.sz,1);s.visible=false;return s;}
const glowTex=cTex(128,128,x=>{const g=x.createRadialGradient(64,64,10,64,64,62);g.addColorStop(0,'rgba(255,230,120,.0)');g.addColorStop(.6,'rgba(255,220,90,.75)');g.addColorStop(1,'rgba(255,220,90,0)');x.fillStyle=g;x.fillRect(0,0,128,128);});

/* =========================================================
   THE WORLD AROUND YOU (metres; origin = your feet, angle 0 = straight ahead)
   ========================================================= */
const world=new THREE.Group();world.visible=false;scene.add(world);
const pol=(deg,r,y)=>new V3(Math.sin(deg*D)*r,y,-Math.cos(deg*D)*r);
const SURF=.95;
/* --- beach mat on your floor --- */
const beach=new THREE.Group();world.add(beach);

let curQ=null;

function confetti(){const box=$('#end');for(let i=0;i<60;i++){const c=document.createElement('div');c.className='conf';c.style.left=Math.random()*100+'%';c.style.background=['#FFD23F','#2457C5','#ff6f61','#1f9d6b','#7ee0ff'][i%5];c.style.animationDuration=(2+Math.random()*2)+'s';c.style.animationDelay=Math.random()*.6+'s';box.appendChild(c);setTimeout(()=>c.remove(),4800);}}

function visAll(o){while(o){if(!o.visible)return false;o=o.parent;}return true;}
function tapRoot(o){while(o&&!o.userData.tap)o=o.parent;return o;}
function firstHit(hits){return hits.find(q=>visAll(q.object)&&q.object.material!==inkMat&&tapRoot(q.object));}
function onHit(obj,point){const o=tapRoot(obj);if(!o)return;const k=o.userData.tap;const wp=point||o.getWorldPosition(new V3());
  if(phase==='beach'&&k==='trash'){if(tapped[o.uuid])return;tapped[o.uuid]=1;o.userData.mark.visible=false;o.userData.glow.visible=false;pop();burst(wp);say(o.userData.name);o.userData.wob=1;
    if(Object.keys(tapped).length>=3)setTimeout(()=>{marks([]);guide('هذه نفايات! لنكتشف لماذا يجب أن نحمي المحيط.',[['هيا ندخل المحيط 🌊',()=>setPhase('home'),'alt']]);},1600);return;}
  if(phase==='home'&&['shark','crab','fish'].includes(k)){if(!tapped[k]){tapped[k]=1;o.userData.mark.visible=false;}pop();burst(wp);say(o.userData.name);o.userData.label.visible=true;o.userData.jump=1;
    if(['shark','crab','fish'].every(x=>tapped[x])&&!tapped.q){tapped.q=1;setTimeout(()=>ask(Q.home),1800);}return;}
  if(k==='turtle'){say('أنا لؤلؤة! أعيش في المحيط أيضاً.');turtle.userData.label.visible=true;turtle.userData.jump=1;burst(wp);return;}
  if(phase==='food'&&k==='net'&&netState.phase==='idle'){netState={t:0,phase:'down'};fisher.userData.mark.visible=false;splash();burst(wp);say('يرمي الصياد شبكته في الماء… راقبها!');return;}
  if(phase==='trade'&&k==='ship'&&shipState.phase==='idle'){shipState={t:0,phase:'sail'};ship.userData.mark.visible=false;burst(wp);tone(160,1.2,'sawtooth',.03,120);say('أبحرت السفينة! التفت وراقبها.');return;}
  if(phase==='clean'&&k==='trash'&&!o.userData.fly){o.userData.fly=.001;o.userData.mark.visible=false;o.userData.glow.visible=false;burst(wp);pop();}}

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();

async function startXR(){const s=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay','local-floor'],domOverlay:{root:$('#ui')}});mode='xr';
  renderer.xr.enabled=true;try{renderer.xr.setReferenceSpaceType('local-floor');await renderer.xr.setSession(s);localFloor=true;}catch(e){renderer.xr.setReferenceSpaceType('local');await renderer.xr.setSession(s);}
  const vs=await s.requestReferenceSpace('viewer');hitSource=await s.requestHitTestSource({space:vs});
  const ctrl=renderer.xr.getController(0);scene.add(ctrl);
  ctrl.addEventListener('select',()=>{if(!placed){if(reticle.visible){const y=new V3().setFromMatrixPosition(reticle.matrix).y;surround(y);reticle.visible=false;$('#xrHint').classList.add('hidden');setPhase('beach');}return;}
    const m=new THREE.Matrix4().extractRotation(ctrl.matrixWorld);ray.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);ray.ray.direction.set(0,0,-1).applyMatrix4(m);const h=firstHit(ray.intersectObject(world,true));if(h)onHit(h.object,h.point);});
  $('#ui').addEventListener('beforexrselect',e=>{if(e.target.closest('.p'))e.preventDefault();});s.addEventListener('end',()=>location.reload());
  $('#xrHint').textContent='وجّه الكاميرا نحو الأرض حولك حتى تظهر الحلقة الصفراء، ثم المس الشاشة 👆';$('#xrHint').classList.remove('hidden');say('وجّه الكاميرا نحو الأرض، ثم المس الشاشة.');}
async function startCamera(){mode='cam';try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const v=$('#cam');v.srcObject=st;v.classList.remove('hidden');$('#bg').classList.add('hidden');await v.play().catch(()=>{});}
  catch(e){mode='none';toast('لم نتمكن من فتح الكاميرا، سنكمل بدونها');setTimeout(addGround,100);}
  try{if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){gyro=(await DeviceOrientationEvent.requestPermission())==='granted';}else gyro='DeviceOrientationEvent' in window;}catch(e){gyro=false;}
  if(gyro)addEventListener('deviceorientation',e=>{if(e.alpha!=null)orient=e;},true);

const zee=new V3(0,0,1),eul=new THREE.Euler(),q0=new THREE.Quaternion(),q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)),devQ=new THREE.Quaternion();

$('#btnRe').addEventListener('click',()=>{if(mode==='xr'&&!placed)return;const y=world.position.y;surround(y);toast('المحيط حولك الآن 🎯');});
async function begin(useAR){audio();say('مرحباً أيها المستكشف الصغير! أنا لؤلؤة السلحفاة. هيا نكتشف أسرار المحيط.');$('#start').classList.add('hidden');$('#ui').classList.remove('hidden');

  mode='none';camera.position.set(0,EYE,0);camera.rotation.set(-.35,0,0);surround(0);addGround();setTimeout(()=>setPhase('beach'),1400);}
function addGround(){const g=new THREE.Mesh(new THREE.CircleGeometry(14,64),new THREE.MeshToonMaterial({map:sandTex,gradientMap:grad,color:new THREE.Color('#e8d6a6')}));g.rotation.x=-Math.PI/2;g.position.y=-.01;world.add(g);$('#bg').style.background='linear-gradient(#bfeaff,#e6f6ff 60%,#f1e3b8)';}

/* ---------- touch: look around (no sensor) and tap ---------- */
const el=renderer.domElement;let down=null;const ptrs=new Map();
el.addEventListener('pointerdown',e=>{audio();if(AC&&AC.state==='suspended')AC.resume();ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===1)down={t:performance.now(),m:0};else down=null;});
el.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const pr=ptrs.get(e.pointerId),dx=e.clientX-pr.x,dy=e.clientY-pr.y;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1&&down){down.m+=Math.abs(dx)+Math.abs(dy);if(mode==='none'||(mode==='cam'&&!gyro)){camera.rotation.y+=dx*.005;camera.rotation.x=clamp(camera.rotation.x+dy*.004,-1.3,1.1);}else if(mode==='cam'){world.rotation.y+=dx*.004;}}});
el.addEventListener('pointerup',e=>{if(down&&ptrs.size===1&&down.m<12&&performance.now()-down.t<500&&mode!=='xr'){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const h=firstHit(ray.intersectObject(world,true));if(h)onHit(h.object,h.point);}ptrs.delete(e.pointerId);if(ptrs.size===0)down=null;});

const clock=new THREE.Clock();let tt=0;const tv=new V3(),tq=new V3();

  if(mode==='cam'&&gyro)updateGyro();
  /* the sea rises around you and falls back */
  oceanK+=(oceanTarget-oceanK)*Math.min(1,dt*1.2);ocean.visible=oceanK>.02||oceanTarget>0;surface.position.y=SURF*oceanK;surfMat.uniforms.time.value=tt;if(beach.visible&&oceanK>.95&&oceanTarget===1)beach.visible=false;
  if(oceanG&&!muted)oceanG.gain.value=lerp(oceanG.gain.value,.025+.02*oceanK,dt);

    const dirty=plastics.some(g=>g.visible&&g.scale.x>.3)&&!cleaning;surfMat.uniforms.murk.value=lerp(surfMat.uniforms.murk.value,dirty?.85:0,dt*1.2);
    const a=tt*.32;shark.position.set(Math.sin(a)*2.3,.42+Math.sin(tt*.9)*.06,-Math.cos(a)*2.3);shark.rotation.y=-a;shark.userData.tail.forEach(t=>t.rotation.y=Math.sin(tt*6)*.4);
    const ca=200+Math.sin(tt*.35)*35;crab.position.copy(pol(ca,1.25,0));crab.rotation.y=-ca*D;crab.userData.legs.forEach((l,i)=>l.rotation.z=Math.sin(tt*10+i)*.35);
    const sa=-tt*.4+1.5;school.position.set(Math.sin(sa)*1.6,.6+Math.sin(tt*.7)*.08,-Math.cos(sa)*1.6);fishes.forEach((q,i)=>{const b=tt*1.8+q.ph;q.f.position.set(Math.cos(b)*q.r,Math.sin(b*1.3)*.1,Math.sin(b)*q.r);q.f.rotation.y=-b-Math.PI/2;});
    const ds=dirty?.55:1;shark.scale.setScalar(lerp(shark.scale.x,.5*ds,dt*2));school.scale.setScalar(lerp(school.scale.x,.6*ds,dt*2));

    const tgt=targetNow();let tdir=0;if(tgt){tgt.getWorldPosition(tv);world.worldToLocal(tv);tdir=Math.atan2(tv.x,-tv.z);}else{const c=viewCam();c.getWorldPosition(tq);const f=new V3(0,0,-1).applyQuaternion(c.getWorldQuaternion(new THREE.Quaternion()));tdir=Math.atan2(f.x,-f.z)-world.rotation.y;}
    const tangled=turtle.userData.bag.visible;const want=pol(tdir/D,tangled?1.2:.95,tangled?.4:.62);turtle.position.lerp(want,dt*.9);turtle.position.y+=Math.sin(tt*1.6)*.002;turtle.rotation.y+=wrapA((Math.PI/2-tdir)-turtle.rotation.y)*Math.min(1,dt*2);turtle.userData.fl.forEach((f,i)=>f.rotation.y=Math.sin(tt*(tangled?2:4)+i)*.5);
    [shark,crab,school,turtle].forEach(o=>{if(o.userData.jump){o.userData.jump=Math.max(0,o.userData.jump-dt*1.4);o.position.y+=Math.sin(o.userData.jump*Math.PI)*.25;}});
    if(fisher.visible){fisher.position.y=SURF*oceanK+Math.sin(tt*1.6)*.015;fisher.rotation.z=Math.sin(tt*1.3)*.04;let depth=0;
      if(netState.phase==='down'){netState.t+=dt;depth=Math.min(1,netState.t/1.6);if(netState.t>2.4){netState.phase='up';netState.t=0;catchFish.forEach(f=>f.visible=true);say('سحب الصياد شبكته! ماذا فيها؟');}}
      else if(netState.phase==='up'){netState.t+=dt;depth=Math.max(0,1-netState.t/1.6);if(netState.t>2.0){netState.phase='done';catchFish.forEach(f=>f.visible=false);basketFish.forEach(f=>f.visible=true);pop();setTimeout(()=>ask(Q.food),900);}}
      net.position.set(NET_TOP.x,NET_TOP.y-.6-depth*1.3,0);netLine.position.set(NET_TOP.x,(NET_TOP.y+net.position.y)/2,0);netLine.scale.y=NET_TOP.y-net.position.y;}

      else if(shipState.phase==='arrived'){shipState.t+=dt;const n=Math.min(4,Math.floor(shipState.t/.45));ship.userData.boxes.forEach((b,i)=>b.visible=i>=n+2);delivered.forEach((b,i)=>b.visible=i<n);if(shipState.t>2.4){shipState.phase='done';setTimeout(()=>ask(Q.trade),600);}}

      if(t.userData.wob){t.userData.wob=Math.max(0,t.userData.wob-dt*1.6);t.rotation.z=Math.sin(t.userData.wob*12)*.25*t.userData.wob;}
      if(t.userData.fly){t.userData.fly+=dt*1.2;const k=Math.min(1,t.userData.fly);const from=t.userData.home,to=new V3().copy(bin.position).add(new V3(0,.8,0));t.position.set(lerp(from.x,to.x,k),lerp(from.y,to.y,k)+Math.sin(k*Math.PI)*.8,lerp(from.z,to.z,k));t.scale.setScalar(t.userData.homeS*(1-k*.6));
        if(k>=1&&t.visible){t.visible=false;tone(300,.12,'square',.05,150);bin.userData.j=1;if(trash.every(x=>!x.visible)){chime();say('شكراً يا صديق المحيط! تذكّر: المحيط موطن، وغذاء، وطريق للسفن.');setTimeout(()=>{$('#end').classList.remove('hidden');confetti();},1500);}}}});
    if(bin.userData.j){bin.userData.j=Math.max(0,bin.userData.j-dt*3);bin.scale.setScalar(.75*(1+Math.sin(bin.userData.j*Math.PI)*.15));}}
  allTargets.forEach(o=>{const m=o.userData.mark;if(m&&m.visible){const s=m.userData.sz*(1+Math.sin(tt*5)*.12);m.scale.set(s,s,1);}});
  for(let i=0;i<SP;i++){if(spLife[i]<=0)continue;spLife[i]-=dt;spVel[i].y-=dt*1.2;spPos[i*3]+=spVel[i].x*dt;spPos[i*3+1]+=spVel[i].y*dt;spPos[i*3+2]+=spVel[i].z*dt;if(spLife[i]<=0)spPos[i*3+1]=-99;}spG.attributes.position.needsUpdate=true;
  /* turn hints: point to what is behind or beside you */
  const tgt=placed&&!curQ&&$('#end').classList.contains('hidden')?targetNow():null;let L=false,R=false;
  if(tgt&&visAll(tgt)){const c=viewCam();tgt.getWorldPosition(tv);const loc=tv.clone().applyMatrix4(c.matrixWorldInverse);const p=tv.clone().project(c);
    if(loc.z>0||Math.abs(p.x)>.85){if(loc.x<0)L=true;else R=true;}}
  $('#turnL').classList.toggle('hidden',!L);$('#turnR').classList.toggle('hidden',!R);
  renderer.render(scene,camera);});
})();
